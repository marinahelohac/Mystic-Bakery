<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Bakery - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="vampire.png.jfif" alt="Logo da Mystic Bakery">
            </div>
            <span>Segmento:Alimentação e Panificação Artesanal</span>
            <h1>Mystic Bakery</h1>
            <p>Sistema de cadastro de Funcionários</p>
        </header>
        <main>
            <form id="form-cadastro">
                <h3>Dados Pessoais</h3>
                <!--nome-->
                <div class="campo">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Elena Gilbert" required>
                </div>
                <!--endereço-->
                <div class="campo">
                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco" placeholder="Ex: Rua Wickery, 2104" required>
                </div>
                <!--email-->
                <div class="campo">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Ex: elena@mysticbakery.com" required>
                </div>
                <!--telefone-->
                <div class="campo">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="Ex: (00) 00000-0000" required>
                </div>

                <!--dados profissionais-->
                <div class="campo">
                    <label for="cargo">Cargo:</label>
                    <select id="cargo" name="cargo" required>
                        <option value="">Selecione o cargo...</option>
                        <option value="padeiro">Padeiro(a)</option>
                        <option value="confeiteiro">Confeiteiro(a) Artesanal</option>
                        <option value="barista">Barista & Atendente</option>
                        <option value="gerente">Gerente</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="salario">Salário:</label>
                    <input type="number" id="salario" name="salario" step="0.01" min="0" placeholder="Ex: 2500.00"
                        required>
                </div>

                <!-- Turno (Obrigatório pela atividade!) -->
                <div class="campo">
                    <label>Turno de Trabalho:</label>
                    <div class="opcoes-turno">
                        <input type="radio" id="manha" name="turno" value="Manhã" required>
                        <label for="manha">☀️ Manhã (Café em Mystic Falls)</label><br><br>

                        <input type="radio" id="tarde" name="turno" value="Tarde">
                        <label for="tarde">🌤️ Tarde (Horário do Grill)</label><br><br>

                        <input type="radio" id="noite" name="turno" value="Noite">
                        <label for="noite">🌙 Noite (Turno dos Salvatore)</label><br><br>
                    </div>
                </div>

                <button type="submit" class="btn-cadastrar">Cadastrar na Mystic Bakery 🦇✨</button>
            </form>

            </form>
        </main>
        <footer>
            <p class="data-hoje">Hoje em Mystic Falls: <time id="data-hoje"></time></p>
        </footer>
        <script src="script.js"></script>
</body>


</html>
